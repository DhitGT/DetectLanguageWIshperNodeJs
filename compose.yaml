services:
  detector:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MODEL_CACHE: /models
    volumes:
      - models:/models
    expose: ['8000']
    cpus: 4
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    logging:
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      detector:
        condition: service_healthy
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  models:
